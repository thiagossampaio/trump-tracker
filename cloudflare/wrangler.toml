name            = "trump-tracker-telegram-webhook"
main            = "telegram-webhook.js"
compatibility_date = "2024-12-01"

# Secrets — configurar via CLI antes do deploy:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_KEY
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET   # openssl rand -hex 32

# Deploy:
#   cd cloudflare && wrangler deploy

# Após deploy, registrar webhook no Telegram (uma vez) — o secret_token
# DEVE ser o mesmo do secret TELEGRAM_WEBHOOK_SECRET:
#   curl -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
#     -d "url=https://trump-tracker-telegram-webhook.<account>.workers.dev" \
#     -d "secret_token=$TELEGRAM_WEBHOOK_SECRET" \
#     -d 'allowed_updates=["callback_query"]'
